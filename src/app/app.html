<main class="page">
  <header class="header">
    <div class="container header__container">
      <a href="#">
        <img src="images/logo.png" alt="Logo">
      </a>
    </div>
  </header>
  <section class="hero">
    <div class="container hero__container">
      <h1 class="hero__title">Места, которые стоит увидеть хотя бы раз в жизни</h1>
      <div class="hero__divider">
        <img class="hero__line" src="images/line.png" alt="Line">
        <img src="images/Star.png" alt="Star">
      </div>
      <div class="hero__subtitle">
        Необычные рестораны, отели, развлечения другие уникальные места со всего мира
      </div>
      <div class="hero__image">
        <img src="images/explore_world.png" alt="Explore">
      </div>
    </div>
  </section>


  <section class="filters">
    <div class="container filters__container">
      <div class="filters__list">
        @for (filter of filters(); track filter.id) {
          <app-filters [filters]="filter" (click)="toggleFilter(filter); selectFilter(filter.name)"
          />
        }
      </div>
    </div>
  </section>


  <section class="products">
    <div class="container products__container">
      <div class="products__grid">
          @for (card of filteredCards(); track card.id) {
            <app-place-card [card]="card" (toggle)="toggleCard($event)" />
          }

      </div>
    </div>
  </section>
  <footer class="footer">
    <div class="container footer__container">
      <div class="footer__logo">
        <a href="#">
          <img src="images/logo.png" alt="Logo">
        </a>
        <div class="footer__copyright">
          © 2026 unique.places
        </div>
      </div>
      <div class="footer__media">
        <a href="#">Pinterest</a>
        <a href="#">Telegram</a>
      </div>
    </div>
  </footer>
</main>
